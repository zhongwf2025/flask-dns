{% extends "base.html" %}
{% block title %}修改密码 - DNS管理系统{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h6>修改管理员密码</h6></div>
    <div class="card-body">
        <div class="form-group">
            <label>当前密码</label>
            <input type="password" class="form-control" id="oldPassword" placeholder="请输入当前密码">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" class="form-control" id="newPassword" placeholder="请输入新密码">
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入新密码">
        </div>
        <button class="btn btn-primary" onclick="changePassword()"><i class="fas fa-save"></i> 确认修改</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function changePassword() {
    const oldPwd = document.getElementById('oldPassword').value;
    const newPwd = document.getElementById('newPassword').value;
    const confirmPwd = document.getElementById('confirmPassword').value;

    if (!oldPwd || !newPwd || !confirmPwd) {
        alert('请填写所有字段');
        return;
    }
    if (newPwd !== confirmPwd) {
        alert('两次输入的新密码不一致');
        return;
    }
    if (newPwd.length < 3) {
        alert('新密码长度不能少于3位');
        return;
    }

    fetch('/api/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            old_password: oldPwd,
            new_password: newPwd
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.code === 0) {
            alert('密码修改成功！');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } else {
            alert(data.msg || '修改失败');
        }
    });
}
</script>
{% endblock %}
